<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando...</title>
    <script>
      // Pega o caminho real acessado, ex: /imagens, /video
      var path = window.location.pathname;

      // Redireciona para HashRouter
      if (path && path !== "/") {
        window.location.replace("/#/".concat(path.replace("/", "")));
      } else {
        window.location.replace("/#/"); 
      }
    </script>
  </head>
  <body></body>
</html>
