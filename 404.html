<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>Redirecionando...</title>
    <script>
      // Caminho acessado: ex. /video, /imagens
      var path = window.location.pathname;

      // Nome do repositório no GitHub Pages
      var repo = "/estevamjannuzzi.github.io";

      // Remove o prefixo do repositório
      var cleanPath = path.replace(repo, "");

      // Se acessou /video → redireciona para /#/video
      if (cleanPath && cleanPath !== "/") {
        window.location.replace(repo + "/#/" + cleanPath.replace("/", ""));
      } else {
        window.location.replace(repo + "/#/");
      }
    </script>
  </head>
  <body></body>
</html>
